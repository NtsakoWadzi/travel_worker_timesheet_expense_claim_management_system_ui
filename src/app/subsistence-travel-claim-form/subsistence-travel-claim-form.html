<div class="manager-form-shell">
  <aside class="sidebar" aria-label="Manager navigation">
    <div class="sidebar-brand">
      <img src="logo.jpeg" alt="Department of Public Works and Infrastructure" />
      <div>
        <strong>Travel Worker</strong>
        <span>Manager Portal</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button type="button" class="nav-item" (click)="goToApprovals()">
        <mat-icon>fact_check</mat-icon>
        <span>Claims</span>
      </button>
      <button type="button" class="nav-item active" (click)="goToSubsistenceTravelForm()">
        <mat-icon>description</mat-icon>
        <span>S&amp;T PW 1516</span>
      </button>
      <button type="button" class="nav-item" (click)="goToAuthorisation()">
        <mat-icon>verified</mat-icon>
        <span>Authorisation</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-summary">
        <mat-icon>supervisor_account</mat-icon>
        <div>
          <strong>{{ managerName }}</strong>
          <span>Manager</span>
        </div>
      </div>
      <button type="button" class="nav-item logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="manager-form-container">
    <header class="manager-form-header">
      <div>
        <h1>S&amp;T PW 1516: Subsistence And Travelling Claim Form</h1>
      </div>
    </header>

    <section class="manager-form-panel" aria-label="Subsistence and travelling claim form">
      <div class="manager-form-table-wrap">
        <table class="manager-form-table">
          <tbody>
            <tr>
              <th scope="row">National Department: Public Works</th>
              <td><input class="table-input" type="text" aria-label="National department" /></td>
              <th scope="row">Claim Number:</th>
              <td><input class="table-input" type="text" aria-label="Claim number" /></td>
              <th scope="row">Captured by:</th>
              <td><input class="table-input" type="text" aria-label="Captured by" /></td>
              <th scope="row">Date captured:</th>
              <td><input class="table-input" type="date" aria-label="Date captured" /></td>
            </tr>
            <tr>
              <th scope="row">Advance taken:</th>
              <td><input class="table-input" type="text" aria-label="Advance taken" /></td>
              <th scope="row">Amount:</th>
              <td><input class="table-input" type="number" aria-label="Amount" /></td>
              <th scope="row">Authrised by:</th>
              <td><input class="table-input" type="text" aria-label="Authrised by" /></td>
              <th scope="row">Date authorised:</th>
              <td><input class="table-input" type="date" aria-label="Date authorised" /></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
