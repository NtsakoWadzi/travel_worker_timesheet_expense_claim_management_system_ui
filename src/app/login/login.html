<div class="login-container">
    <img 
          src="assets/images/DEPARTMENT-OF-PUBLIC-WORKS-INFRASTRUCTURE.png" 
          alt="Department of Public Works and Infrastructure - Republic of South Africa"
          class="logo"/>


  <mat-card>
    <mat-card-content>
      <form color="primary">

        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" />
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit">Login</button>

        <p class="signup-link">Don't have an account? <a routerLink="/signup">Sign up</a></p>

      </form>
    </mat-card-content>
  </mat-card>
</div>
