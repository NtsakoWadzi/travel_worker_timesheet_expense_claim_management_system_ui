<div class="login-container">
  <img src="loginbackground.jpec" alt="">

  <mat-card>
       <img src="logo.jpeg" alt="Department of Public Works and Infrastructure - Republic of South Africa"
    class="logo" />
   
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="userName" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input
           matInput type="password" formControlName="userPassword" />
        </mat-form-field>

        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>

        <p class="signup-link">Don't have an account? <a routerLink="/signup">Sign up</a></p>

      </form>
    </mat-card-content>
  </mat-card>
</div>
